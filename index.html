<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>유통기한 관리 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h3 class="app-title">유통기한 관리 시스템</h3>

    <div class="nav-tabs">
      <!-- Phase 3-2: 인라인 onclick 제거 → JS addEventListener -->
      <div id="tab-btn-input" class="nav-tab active">신규 입고 입력</div>
      <div id="tab-btn-list" class="nav-tab">재고 조회</div>
    </div>

    <!-- 1. 입고 입력 탭 -->
    <div id="inputTab" class="tab-content active">
      <!-- Phase 3-2: 인라인 onsubmit 제거 -->
      <form id="entryForm">
        <!-- Phase 2-4: pattern/oninvalid/oninput 제거 → JS에서 단일 관리 -->
        <label for="productCode">상품코드
          <input type="text" id="productCode" placeholder="예: FC0325002, DY0326007, PT1222019" required>
        </label>
        <label for="productName">상품명
          <input type="text" id="productName" placeholder="상품명을 입력하세요" required>
        </label>
        <label for="expiryDate">유통기한
          <input type="date" id="expiryDate" required>
        </label>
        <div class="grid">
          <label for="receivedDate">입고날짜
            <input type="date" id="receivedDate" required>
          </label>
          <label for="inspector">조사자
            <input type="text" id="inspector" placeholder="이름" required>
          </label>
        </div>

        <button type="submit" class="outline">📥 목록에 담기</button>
      </form>

      <!-- Phase 4-3: 인라인 스타일 → CSS 클래스 분리 -->
      <div id="cartSection" class="cart-section">
        <h4 class="cart-section-title">임시 대기열 (저장 전)</h4>
        <div id="cartList"></div>
      </div>
    </div>

    <!-- 2. 목록 조회 탭 -->
    <div id="listTab" class="tab-content">
      <!-- Phase 3-2: 인라인 oninput 제거 → JS addEventListener -->
      <input type="text" id="searchInput" placeholder="상품명 또는 코드로 검색...">
      <!-- Phase 3-2: 인라인 onclick 제거 → data-filter 속성 + 이벤트 위임 -->
      <div class="filter-group">
        <button type="button" class="filter-btn" data-filter="폐기">폐기대상</button>
        <button type="button" class="filter-btn secondary" data-filter="유통기한 임박상품">임박상품만</button>
        <button type="button" class="filter-btn secondary" data-filter="OK">OK만</button>
      </div>
      <div id="loading" class="loading-spinner">데이터를 불러오는 중...</div>
      <div id="productList"></div>
    </div>
  </div>

  <!-- Phase 3-2: 인라인 onclick 제거 -->
  <button id="floatingBatchBtn" class="floating-btn"></button>

  <!-- 비밀번호 입력 모달 -->
  <dialog id="pinModal" open>
    <article>
      <h3>접근 인증</h3>
      <input type="password" id="pinInput" placeholder="비밀번호 4자리" maxlength="10">
      <!-- Phase 3-2: 인라인 onclick 제거 -->
      <footer><button type="button">확인</button></footer>
    </article>
  </dialog>

  <script src="main.js"></script>
</body>
</html>
