<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>유통기한 관리 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h3 class="app-title">유통기한 관리 시스템</h3>

    <div class="nav-tabs">
      <div id="tab-btn-input" class="nav-tab active" onclick="switchTab('inputTab')">신규 입고 입력</div>
      <div id="tab-btn-list" class="nav-tab" onclick="switchTab('listTab')">재고 조회</div>
    </div>

    <!-- 1. 입고 입력 탭 -->
    <div id="inputTab" class="tab-content active">
      <!-- onsubmit을 addToCart로 변경 -->
      <form id="entryForm" onsubmit="addToCart(event)">
        <label for="productCode">상품코드
          <input type="text" id="productCode" placeholder="예: FC0325002, DY0326007, PT1222019" required pattern="^(FC|DY|PT)\d{7}$" oninvalid="this.setCustomValidity('FC, DY, PT로 시작하는 9자리 코드를 입력해 주세요.')"
       oninput="this.setCustomValidity('')">
        </label>
        <label for="productName">상품명
          <input type="text" id="productName" placeholder="상품명을 입력하세요" required>
        </label>
        <label for="expiryDate">유통기한
          <input type="date" id="expiryDate" required>
        </label>
        <div class="grid">
          <label for="receivedDate">입고날짜
            <input type="date" id="receivedDate" required>
          </label>
          <label for="inspector">조사자
            <input type="text" id="inspector" placeholder="이름" required>
          </label>
        </div>

        <!-- 저장 대신 장바구니 담기 버튼으로 변경 -->
        <button type="submit" class="outline">📥 목록에 담기</button>
      </form>

      <!-- 장바구니 구역 -->
      <div id="cartSection" style="display: none; margin-top: 20px; padding-bottom: 80px;">
        <h4 style="font-size: 15px; color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 5px;">임시 대기열 (저장 전)</h4>
        <div id="cartList"></div>
      </div>
    </div>

    <!-- 2. 목록 조회 탭 -->
    <div id="listTab" class="tab-content">
      <input type="text" id="searchInput" placeholder="상품명 또는 코드로 검색..." oninput="renderList()">
      <div class="filter-group">
        <button type="button" class="filter-btn" onclick="setFilter('폐기')">폐기대상</button>
        <button type="button" class="filter-btn secondary" onclick="setFilter('유통기한 임박상품')">임박상품만</button>
        <button type="button" class="filter-btn secondary" onclick="setFilter('OK')">OK만</button>
      </div>
      <div id="loading" class="loading-spinner">데이터를 불러오는 중...</div>
      <div id="productList"></div>
    </div>
  </div>

  <!-- 플로팅 일괄 전송 버튼 -->
  <button id="floatingBatchBtn" class="floating-btn" onclick="submitBatch()" style="display: none;"></button>

  <!-- 비밀번호 입력 모달 -->
  <dialog id="pinModal" open>
    <article>
      <h3>접근 인증</h3>
      <input type="password" id="pinInput" placeholder="비밀번호 4자리" maxlength="10">
      <footer><button type="button" onclick="savePin()">확인</button></footer>
    </article>
  </dialog>

  <script src="main.js"></script>
</body>
</html>
